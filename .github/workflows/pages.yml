# Publishes the MkDocs documentation only. The browser application is not deployed to GitHub Pages.
name: Deploy documentation to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-docs.txt
      - name: Stage self-hosted Atkinson Hyperlegible fonts
        run: mkdir -p docs/assets/fonts && cp src/fonts/atkinson-400.woff2 src/fonts/atkinson-700.woff2 docs/assets/fonts/
      - run: mkdocs build --site-dir _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
