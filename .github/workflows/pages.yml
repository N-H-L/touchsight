# Publishes the documentation site at the GitHub Pages root and the app at /app.
name: Deploy documentation and app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          grep -q "src/samples" scripts/eval.mjs 2>/dev/null || echo "warn: app/ may not have been renamed yet" >&2
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: rm -rf src/dev
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --site-dir _site
      - run: |
          mkdir -p _site/app
          cp -r src/. _site/app/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
