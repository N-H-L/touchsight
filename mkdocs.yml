site_name: TouchSight-NG Documentation
site_description: Turn labeled diagrams into tactile graphics with braille labels, entirely in the browser.
site_author: Michael Ryan Hunsaker, M.Ed., Ph.D.
site_url: https://mrhunsaker.github.io/touchsight-NG/
repo_url: https://github.com/mrhunsaker/touchsight-NG
repo_name: mrhunsaker/touchsight-NG
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed
extra_css:
  - stylesheets/accessibility.css
extra_css:
  - stylesheets/accessibility.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
nav:
  - Home: index.md
  - For transcribers:
      - Getting started: getting-started.md
      - The teacher review workflow: review-workflow.md
      - Printing and swell paper: printing.md
  - How it works:
      - Architecture: architecture.md
      - Pipeline stages: pipeline.md
      - Models and inference engines: models-and-engines.md
      - Advanced model options (not implemented): advanced-model-options.md
      - Tactile layout and BANA guidelines: guidelines.md
      - Module reference: modules.md
  - Project:
      - Evaluation and benchmarks: evaluation.md
      - Deployment (GitHub Pages): deployment.md
      - Contributing: contributing.md
      - Changelog: changelog.md
