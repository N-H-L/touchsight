<!doctype html>
<!-- Placeholder resources page. The Neutralino window loads the TouchSight-NG
     application from the local static server (http://localhost:5173/), so this
     file is only shown if that server is not running when the window opens. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TouchSight-NG</title>
  </head>
  <body style="font-family: sans-serif; padding: 2rem; line-height: 1.5">
    <h1>TouchSight-NG is not reachable</h1>
    <p>
      The desktop window failed to load <code>http://localhost:5173/</code>.
      The static server may still be starting, or it failed to launch. Close
      this window and run <code>npm run desktop</code> again from the
      repository root.
    </p>
    <p><a href="http://localhost:5173/">Retry</a></p>
  </body>
</html>
